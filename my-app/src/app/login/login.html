<div class="login-wrapper">
  <div class="login-card">

    <div class="login-header">
      <h2>{{ isRegisterMode ? 'Register' : 'Login System' }}</h2>
    </div>

    <div *ngIf="errMessage" class="alert alert-error">{{ errMessage }}</div>
    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>

    <form (ngSubmit)="isRegisterMode ? onRegister() : onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="user"
          name="user"
          placeholder="Enter your username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          [(ngModel)]="pwd"
          name="pwd"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
        <label class="show-pw-label">
          <input type="checkbox" [(ngModel)]="showPassword" name="showPw" /> Show password
        </label>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Please wait...' : (isRegisterMode ? 'Register' : 'Login') }}
      </button>
    </form>

    <div class="login-footer">
      <span *ngIf="!isRegisterMode">Don't have an account?</span>
      <span *ngIf="isRegisterMode">Already have an account?</span>
      <a (click)="toggleMode()" class="toggle-link">
        {{ isRegisterMode ? 'Sign in' : 'Register now' }}
      </a>
    </div>

  </div>
</div>
